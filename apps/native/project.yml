name: RaceCorProDrive
bundleIdPrefix: racing.k10motorsports.prodrive.racecor

settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

options:
  deploymentTarget:
    macOS: "14.0"

targets:
  RaceCorProDrive:
    type: application
    platform: macOS
    sources:
      - path: Sources
        includes:
          - "**/*.swift"
    resources:
      # Force xcodegen to treat the .xcassets as a single folder
      # reference rather than recursing in and adding each imageset
      # separately. Without `type: folder`, a prior generation wrote
      # each .imageset as its own broken PBX entry (the ? marks in
      # the navigator), so actool never saw the catalog as one unit.
      - path: Resources/Assets.xcassets
        type: folder
    settings:
      BUNDLE_ID: racing.k10motorsports.prodrive.racecor.mac
      PRODUCT_BUNDLE_IDENTIFIER: racing.k10motorsports.prodrive.racecor.mac
      PRODUCT_NAME: RaceCorProDrive
      INFOPLIST_KEY_CFBundleDisplayName: RaceCor Pro Drive
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
      INFOPLIST_KEY_LSSupportsDefaultHandlerForSchemes: true
      INFOPLIST_FILE: Resources/Info.plist.template
      # Without this, Xcode's asset catalog compiler (actool) never emits
      # AppIcon.icns into the bundle — the PNGs exist in the .xcassets
      # source tree but don't get compiled into the product. The Info.plist
      # CFBundleIconName key then resolves to nothing at runtime and Dock
      # falls back to the generic app icon.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: Sources/Support/RaceCorProDrive.entitlements
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      ENABLE_HARDENED_RUNTIME: true
      OTHER_CODE_SIGN_FLAGS: --deep
    entitlements:
      path: Sources/Support/RaceCorProDrive.entitlements

schemes:
  RaceCorProDrive-Debug:
    build:
      targets:
        RaceCorProDrive: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug

  RaceCorProDrive-Release:
    build:
      targets:
        RaceCorProDrive: all
    run:
      config: Release
    archive:
      config: Release
    profile:
      config: Release
