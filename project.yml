name: RaceCorProDrive
bundleIdPrefix: racing.k10motorsports.prodrive.racecor

settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

options:
  deploymentTarget:
    macOS: "14.0"

targets:
  RaceCorProDrive:
    type: application
    platform: macOS
    attributes:
      DevelopmentTeam: SQ283GVB96
      ProvisioningStyle: Automatic
    sources:
      - path: Sources
        includes:
          - "**/*.swift"
      # Asset catalog — listed under `sources:` (not `resources:`)
      # because XcodeGen 2.45.x silently drops a top-level `resources:`
      # entry pointing at .xcassets. Listing under sources lets
      # XcodeGen detect the .xcassets extension and emit a
      # `folder.assetcatalog` PBX entry assigned to the resources
      # build phase, which is what actool needs to run on it.
      #
      # The earlier `type: folder` override (back when this lived in
      # `resources:`) made Xcode add the directory as a plain folder
      # reference, so actool never ran. The bundle shipped with no
      # Assets.car / no AppIcon.icns even though every PNG in the
      # iconset was valid — Dock fell back to the generic icon.
      - path: Resources/Assets.xcassets
    settings:
      BUNDLE_ID: racing.k10motorsports.prodrive.racecor.mac
      PRODUCT_BUNDLE_IDENTIFIER: racing.k10motorsports.prodrive.racecor.mac
      PRODUCT_NAME: RaceCorProDrive
      INFOPLIST_KEY_CFBundleDisplayName: RaceCor Pro Drive
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
      INFOPLIST_KEY_LSSupportsDefaultHandlerForSchemes: true
      INFOPLIST_FILE: Resources/Info.plist.template
      # Without this, Xcode's asset catalog compiler (actool) never emits
      # AppIcon.icns into the bundle — the PNGs exist in the .xcassets
      # source tree but don't get compiled into the product. The Info.plist
      # CFBundleIconName key then resolves to nothing at runtime and Dock
      # falls back to the generic app icon.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: Sources/Support/RaceCorProDrive.entitlements
      # CODE_SIGN_IDENTITY is set per-config below (Debug=Apple Development,
      # Release=Developer ID Application) so `xcodebuild archive` requests
      # a Developer-ID Distribution profile, which is what notarytool needs.
      DEVELOPMENT_TEAM: SQ283GVB96
      ENABLE_HARDENED_RUNTIME: true
      OTHER_CODE_SIGN_FLAGS: --deep
    entitlements:
      path: Sources/Support/RaceCorProDrive.entitlements

schemes:
  RaceCorProDrive-Debug:
    build:
      targets:
        RaceCorProDrive: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
    test:
      config: Debug

  RaceCorProDrive-Release:
    build:
      targets:
        RaceCorProDrive: all
    run:
      config: Release
    archive:
      config: Release
    profile:
      config: Release

configs:
  Debug:
    settings:
      CODE_SIGN_IDENTITY: "Apple Development"
  Release:
    settings:
      CODE_SIGN_IDENTITY: "Developer ID Application"
