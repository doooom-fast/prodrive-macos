name: Build & Release

# Builds the macOS app on a v* tag, signs with Developer ID, notarizes via
# notarytool, and attaches a notarized .dmg to the GitHub release.
#
# Distribution model: direct download. Mirrors the prodrive-windows .exe
# pattern — no App Store review gate.
#
# Required org-level secrets (set on the k10-motorsports org, scoped to
# this repo):
#   APPLE_TEAM_ID                     — 10-char Team ID (e.g. SQ283GVB96)
#   APP_STORE_CONNECT_API_KEY_ID      — 10-char API key ID
#   APP_STORE_CONNECT_API_ISSUER_ID   — issuer UUID
#   APP_STORE_CONNECT_API_KEY_P8      — base64-encoded .p8 file contents
#   MACOS_DEVELOPER_ID_P12_BASE64     — base64-encoded .p12 export of the
#                                       "Developer ID Application" cert +
#                                       its private key from a local Mac's
#                                       Keychain Access. Cloud-managed
#                                       Developer ID was attempted first
#                                       and never produced a usable cert
#                                       — the .p12 path is what works.
#   MACOS_DEVELOPER_ID_P12_PASSWORD   — password used during .p12 export
#
# The App Store Connect API key is used for notarization (notarytool
# accepts the same key format App Store Connect uses) and to fetch any
# provisioning assets during archive. The .p12 cert is what actually
# signs the exported .app for Developer ID distribution.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign, Notarize, Release
    runs-on: macos-latest

    env:
      SCHEME: RaceCorProDrive-Release
      PROJECT: RaceCorProDrive.xcodeproj
      CONFIG: Release
      ARCHIVE_PATH: build/RaceCorProDrive.xcarchive
      EXPORT_PATH: build/export
      APP_NAME: RaceCorProDrive
      DMG_NAME: RaceCorProDrive.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # BrandKit.swift uses Color.glassEffect(in:) which is gated to
          # the iOS 26 / macOS 26 SDK. macos-latest still defaults to
          # Xcode 16.x as of this writing, so pick the highest installed
          # Xcode 26.x to make the symbol resolve.
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26.x found on runner"
            ls /Applications/ | grep -i Xcode
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Resolve version from tag
        id: version
        run: |
          # v1.2.3 -> 1.2.3
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Set MARKETING_VERSION + bump CURRENT_PROJECT_VERSION
        run: |
          # Update project.yml in place so xcodegen emits the right version.
          # CURRENT_PROJECT_VERSION (build number) uses the GitHub run number
          # to guarantee monotonic increase across re-runs of the same tag.
          /usr/bin/sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"${{ steps.version.outputs.version }}\"/" project.yml
          /usr/bin/sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Import Developer ID Application certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Cloud-managed Developer ID signing was tried for v0.10.0–v0.12.1
          # and never resolved a "Developer ID Application" cert during
          # -exportArchive. We now ship the cert as a .p12 secret and import
          # it into a temporary keychain that lives only for this run.
          P12_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$P12_BASE64" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Required so codesign can use the key without an interactive prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add our keychain to the search list (default-keychain alone is
          # not enough for xcodebuild to find identities).
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          rm -f "$P12_PATH"

          echo "Identities visible to codesign:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive (Developer ID distribution)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=macOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8 \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Export signed .app
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Re-unlock the keychain in case it auto-locked between steps.
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist

      - name: Build DMG
        run: |
          # hdiutil-built UDZO disk image of the .app — the simplest
          # distribution format for direct download. No background image
          # or fancy layout; just drag-to-Applications via Finder convention.
          mkdir -p build/dmg-staging
          cp -R "$EXPORT_PATH/$APP_NAME.app" build/dmg-staging/
          ln -s /Applications build/dmg-staging/Applications
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder build/dmg-staging \
            -ov \
            -format UDZO \
            "build/$DMG_NAME"

      - name: Notarize DMG
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcrun notarytool submit "build/$DMG_NAME" \
            --key ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8 \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait

      - name: Staple notarization
        run: xcrun stapler staple "build/$DMG_NAME"

      - name: Verify stapled DMG
        run: |
          xcrun stapler validate "build/$DMG_NAME"
          spctl -a -t open --context context:primary-signature -v "build/$DMG_NAME" || true

      - name: Attach DMG to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.DMG_NAME }}
          fail_on_unmatched_files: true
